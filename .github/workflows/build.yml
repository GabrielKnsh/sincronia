name: Gerar aplicativos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller pillow pytest

      - name: Testes
        run: python -m pytest -q

      - name: Gerar aplicativo
        run: python build.py

      - name: Autoteste (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/Sincronia.app/Contents/MacOS/Sincronia --selftest selftest.txt
          cat selftest.txt
          grep -q "Sincronia.app" selftest.txt
          grep -q "ffmpeg version" selftest.txt

      - name: Autoteste (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\Sincronia\Sincronia.exe -ArgumentList "--selftest","selftest.txt" -Wait
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern "ffmpeg version" -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Sincronia-${{ matrix.os }}
          path: dist/*.zip
